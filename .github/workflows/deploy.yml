name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # PR에서는 빌드와 링크 검사만 돌려 깨진 상태가 main에 들어가지 않게 한다. 배포는 하지 않는다.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 먼저 시작한 배포는 끝까지 두고, 대기 중인 것만 최신으로 교체한다.
# PR 빌드는 PR별 그룹으로 분리해 대기 중인 배포를 밀어내지 않게 한다.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # 콘텐츠 스키마 검증(astro build)과 내부 링크 검사(scripts/check-links.mjs)를 함께 돌린다.
      # 하나라도 실패하면 이 단계에서 멈추고 배포되지 않는다.
      - name: Install, build, check links, and upload site
        uses: withastro/action@v6
        with:
          build-cmd: npm run build:ci

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
