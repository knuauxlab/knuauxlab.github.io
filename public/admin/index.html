      Sveltia CMS. 버전을 고정하고 무결성 해시(integrity)를 걸어, CDN에서 파일이 바뀌면 로드되지 않게 한다.
      버전을 올릴 때는 새 파일의 해시를 다시 계산해서 함께 바꾼다 (docs/cms.md 참고).
      type="module"과 스타일시트 링크는 넣지 않는다 (공식 문서의 안내).
    -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.258.1/dist/sveltia-cms.js"
      integrity="sha384-de/3M+uPwFt49OFqCPX3PaI93kBil3RI4m0yXHFuvBIBQcAWDnH3FDZu6P8y7vEL"
      crossorigin="anonymous"
    ></script>
