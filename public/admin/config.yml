# AUX Lab 콘텐츠 관리(Sveltia CMS) 설정.
# 필드는 src/content.config.ts의 스키마와 맞춰야 한다. 어긋나면 `npm run check:cms`가 알려준다.
# 사용법은 docs/cms.md에 있다.

backend:
  name: github
  repo: knuauxlab/lab_website
  branch: main

locale: ko
site_url: https://knuauxlab.github.io/lab_website/
display_url: https://knuauxlab.github.io/lab_website/
logo_url: /lab_website/logo.png

# 파일명은 ASCII로만 만든다. 한글 파일명은 링크와 도구에서 말썽이 되기 쉽다.
slug:
  encoding: ascii
  clean_accents: true
  maxlength: 60

# 사진은 src/assets에 저장하고, 글에는 /src/assets/... 경로로 적는다. Astro의 image()가 이 경로를 읽어 최적화한다.
media_folder: /src/assets
public_folder: /src/assets

collections:
  # ---------- 소식 ----------
  - name: news
    label: 소식
    label_singular: 소식
    folder: /src/content/news
    extension: md
    create: true
    slug: '{{year}}-{{month}}-{{uuid_short}}'
    summary: '{{date}} · {{title}}'
    sortable_fields: [date, title]
    fields:
      - label: 날짜
        name: date
        widget: string
        hint: '2026-04 처럼 월까지, 일을 알면 2026-04-15 처럼 입력하세요.'
        pattern: ['^\d{4}-\d{2}(-\d{2})?$', '2026-04 또는 2026-04-15 형식으로 입력하세요.']
      - { label: 제목, name: title, widget: string }
      - label: 분류
        name: category
        widget: select
        options:
          - { label: 수상, value: award }
          - { label: 논문, value: paper }
          - { label: 과제, value: project }
          - { label: 구성원, value: member }
          - { label: 행사, value: event }
          - { label: 일반, value: other }
      - { label: 임시 저장(사이트에 표시하지 않음), name: draft, widget: boolean, default: false, required: false }
      - { label: 추가 설명, name: body, widget: markdown, required: false }

  # ---------- 논문 ----------
  - name: publications
    label: 논문
    label_singular: 논문
    folder: /src/content/publications
    extension: md
    create: true
    identifier_field: title
    slug: '{{fields.year}}-{{slug}}'
    summary: '{{year}} · {{title}}'
    sortable_fields: [year, title]
    fields:
      - { label: 논문 제목, name: title, widget: string }
      - label: 저자
        name: authors
        widget: list
        hint: '논문에 적힌 순서대로 한 명씩 추가하세요.'
        field: { label: 이름, name: name, widget: string }
      - { label: 학회/저널, name: venue, widget: string }
      - { label: 연도, name: year, widget: number, value_type: int, min: 2000, max: 2100 }
      - label: 종류
        name: type
        widget: select
        options:
          - { label: 학회, value: conference }
          - { label: 저널, value: journal }
          - { label: 데모 및 포스터, value: demo }
          - { label: 프리프린트, value: preprint }
      - { label: 수상, name: award, widget: string, required: false, hint: '수상한 논문이면 입력하세요.' }
      - label: 링크
        name: links
        widget: object
        required: false
        hint: '제목을 누르면 DOI, arXiv, 소개 페이지, PDF 순으로 먼저 있는 링크로 이동합니다.'
        fields:
          - { label: DOI, name: doi, widget: string, required: false, pattern: ['^https?://', 'https:// 로 시작하는 주소를 입력하세요.'] }
          - { label: arXiv, name: arxiv, widget: string, required: false, pattern: ['^https?://', 'https:// 로 시작하는 주소를 입력하세요.'] }
          - { label: 소개 페이지, name: page, widget: string, required: false, pattern: ['^https?://', 'https:// 로 시작하는 주소를 입력하세요.'] }
          - { label: PDF, name: pdf, widget: string, required: false, pattern: ['^https?://', 'https:// 로 시작하는 주소를 입력하세요.'] }
      - { label: 임시 저장(사이트에 표시하지 않음), name: draft, widget: boolean, default: false, required: false }
      - { label: 추가 설명, name: body, widget: markdown, required: false }

  # ---------- 프로젝트 ----------
  - name: projects
    label: 프로젝트
    label_singular: 프로젝트
    folder: /src/content/projects
    extension: md
    create: true
    slug: '{{year}}-{{month}}-{{uuid_short}}'
    summary: '{{start}} · {{title}}'
    sortable_fields: [start, title]
    fields:
      - { label: 과제명, name: title, widget: string }
      - { label: 지원 기관, name: funder, widget: string }
      - { label: 연구책임자, name: pi, widget: string, required: false }
      - label: 시작
        name: start
        widget: string
        hint: '2026-04 처럼 월까지 입력하세요.'
        pattern: ['^\d{4}-\d{2}$', '2026-04 형식으로 입력하세요.']
      - label: 종료
        name: end
        widget: string
        required: false
        hint: '비워두면 진행 중인 과제로 표시됩니다.'
        pattern: ['^\d{4}-\d{2}$', '2026-04 형식으로 입력하세요.']
      - { label: 요약, name: summary, widget: text, required: false }
      - { label: 임시 저장(사이트에 표시하지 않음), name: draft, widget: boolean, default: false, required: false }
      - { label: 추가 설명, name: body, widget: markdown, required: false }

  # ---------- 구성원 ----------
  - name: members
    label: 구성원
    label_singular: 구성원
    folder: /src/content/members
    extension: md
    create: true
    identifier_field: name
    summary: '{{name}} · {{role}}'
    sortable_fields: [order, name]
    media_folder: /src/assets/members
    public_folder: /src/assets/members
    fields:
      - { label: 이름(영문), name: name, widget: string, hint: 'Gyeore Yun 처럼 영문으로 입력하세요.' }
      - { label: 한글 이름, name: nameKo, widget: string, required: false }
      - label: 직위
        name: role
        widget: select
        options:
          - { label: 지도교수, value: professor }
          - { label: 박사과정, value: phd }
          - { label: 석사과정, value: ms }
          - { label: 학석사 연계과정, value: integrated }
          - { label: 학부연구생, value: undergraduate }
      - label: 상태
        name: status
        widget: select
        default: current
        hint: '졸업하면 졸업생으로 바꾸세요. 졸업생 목록으로 옮겨집니다.'
        options:
          - { label: 재학/재직, value: current }
          - { label: 졸업생, value: alumni }
      - { label: 사진, name: photo, widget: image, required: false, hint: '얼굴이 가운데 오는 정사각형 사진이 가장 좋습니다.' }
      - { label: 이메일, name: email, widget: string, required: false, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', '올바른 이메일 주소를 입력하세요.'] }
      - label: 관심 분야
        name: interests
        widget: list
        required: false
        field: { label: 분야, name: interest, widget: string }
      - label: 링크
        name: links
        widget: object
        required: false
        fields:
          - { label: 홈페이지, name: homepage, widget: string, required: false, pattern: ['^https?://', 'https:// 로 시작하는 주소를 입력하세요.'] }
          - { label: GitHub, name: github, widget: string, required: false, pattern: ['^https?://', 'https:// 로 시작하는 주소를 입력하세요.'] }
          - { label: Google Scholar, name: scholar, widget: string, required: false, pattern: ['^https?://', 'https:// 로 시작하는 주소를 입력하세요.'] }
      - { label: 입학/합류 연도, name: joined, widget: number, value_type: int, min: 2000, max: 2100, required: false }
      - { label: 표시 순서, name: order, widget: number, value_type: int, default: 100, hint: '작은 숫자가 먼저 나옵니다.' }
      - { label: 임시 저장(사이트에 표시하지 않음), name: draft, widget: boolean, default: false, required: false }
      - { label: 소개글, name: body, widget: markdown, required: false }

  # ---------- 연구 분야 ----------
  - name: research_areas
    label: 연구 분야
    label_singular: 연구 분야
    folder: /src/content/research-areas
    extension: md
    create: true
    slug: '{{uuid_short}}'
    summary: '{{order}} · {{title}}'
    sortable_fields: [order, title]
    fields:
      - { label: 연구 분야 이름, name: title, widget: string }
      - { label: 한두 문장 요약, name: summary, widget: text }
      - { label: 표시 순서, name: order, widget: number, value_type: int, default: 100, hint: '작은 숫자가 먼저 나옵니다.' }
      - { label: 임시 저장(사이트에 표시하지 않음), name: draft, widget: boolean, default: false, required: false }

  # ---------- 연구실 정보, 모집 안내 (파일 하나짜리) ----------
  - name: pages
    label: 연구실 정보
    files:
      - name: lab_info
        label: 연구실 기본 정보
        file: /src/content/lab/info.yaml
        format: yaml
        fields:
          - { label: 연구실 이름, name: name, widget: string }
          - { label: 정식 영문 이름, name: fullName, widget: string, required: false }
          - { label: 한 줄 소개, name: tagline, widget: string }
          - { label: 소개글, name: intro, widget: text }
          - { label: 소속, name: affiliation, widget: string }
          - { label: 주소, name: address, widget: string }
          - { label: 이메일, name: email, widget: string, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', '올바른 이메일 주소를 입력하세요.'] }
          - { label: 전화, name: phone, widget: string, required: false }
      - name: join_us
        label: 모집 안내
        file: /src/content/joinus/index.md
        format: frontmatter
        fields:
          - { label: 지금 모집 중, name: recruiting, widget: boolean, default: false }
          - label: 임시 저장(체크하면 기본 안내 문구가 보입니다)
            name: draft
            widget: boolean
            default: false
            required: false
          - { label: 모집 안내 본문, name: body, widget: markdown, required: false }
